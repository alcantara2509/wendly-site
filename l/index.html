<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lista compartilhada no Wendly</title>
<meta name="robots" content="noindex">
<meta name="description" content="Abra para ver a lista e entrar nela pelo Wendly.">
<meta property="og:title" content="Lista compartilhada no Wendly">
<meta property="og:description" content="Abra para ver a lista e entrar nela.">
<meta property="og:image" content="https://wendly.floaterlabs.com/destaque.png">
<link rel="icon" href="../icone.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f4;--fg:#1b2422;--muted:#5b6b67;--accent:#2f6f5e;--panel:#e9eeea;--btn:#1b2422;--btnfg:#f6f7f4;--line:#d6ded9}
@media (prefers-color-scheme:dark){:root{--bg:#141c1b;--fg:#e9efec;--muted:#9fb0ab;--accent:#8fd4b4;--panel:#1b2624;--btn:#e9efec;--btnfg:#141c1b;--line:#2c3a37}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:18px;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:40px 16px 72px}
.brand{display:flex;align-items:center;gap:10px;margin:0 0 28px;color:var(--fg);text-decoration:none;font-weight:900}
.brand img{width:36px;height:36px;border-radius:10px}
h1{font-size:36px;font-weight:900;margin:0 0 6px;line-height:1.15;overflow-wrap:anywhere}
.lead{font-size:19px;color:var(--muted);margin:0 0 20px}
ul{list-style:none;margin:0 0 24px;padding:0;border-top:1px solid var(--line)}
li{padding:12px 2px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
li::before{content:"";display:inline-block;width:14px;height:14px;margin-right:12px;border:2px solid var(--muted);border-radius:50%;vertical-align:-1px}
.more{font-size:16px;color:var(--muted);margin:-12px 0 24px}
.actions{display:flex;flex-direction:column;align-items:flex-start;gap:12px;margin:0 0 8px}
.btn{display:inline-block;padding:14px 26px;border-radius:14px;background:var(--btn);color:var(--btnfg);text-decoration:none;font-weight:900;font-size:19px}
.btn.alt{background:transparent;color:var(--fg);border:2px solid var(--line);padding:12px 24px}
.note{font-size:15px;color:var(--muted);margin:8px 0 0}
.iphone{margin-top:28px;padding:18px 20px;border-radius:16px;background:var(--panel)}
.iphone p{margin:0;font-size:16px}
a{color:var(--accent);font-weight:700}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<a class="brand" href="../"><img src="../icone.png" alt="" width="36" height="36">Wendly</a>
<h1 id="title">Lista compartilhada</h1>
<p class="lead" id="lead">Abrindo o convite…</p>
<ul id="tasks" hidden></ul>
<p class="more" id="more" hidden></p>
<div class="actions" id="actions" hidden>
<a class="btn" id="open" hidden>Abrir no Wendly</a>
<a class="btn alt" id="play" href="https://play.google.com/store/apps/details?id=com.floaterlabs.wendly">Baixar na Google Play</a>
</div>
<p class="note" id="note" hidden>Entra com a conta do Google e edita a mesma lista.</p>
<div class="iphone" id="iphone" hidden>
<p><strong>Tem iPhone?</strong> O Wendly ainda não está na App Store. <a href="https://www.instagram.com/floater.labs/">Entre na lista de espera no Instagram</a> e avisamos quando chegar.</p>
</div>
</main>
<script>
(function(){
var SUPABASE_URL='https://zniyjkxdvjsujpyndqbl.supabase.co';
var SUPABASE_KEY='sb_publishable_j-ryTNsw4I-9BWyi1dQbhA_da6CmYlx';
var PLAY='https://play.google.com/store/apps/details?id=com.floaterlabs.wendly';
var $=function(id){return document.getElementById(id)};
var ua=navigator.userAgent||'';
var android=/Android/i.test(ua);
var iphone=/iPhone|iPad|iPod/i.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1);
var code=(new URLSearchParams(location.search).get('c')||'').trim().toUpperCase();
function fail(text){$('title').textContent='Lista compartilhada';$('lead').textContent=text}
function plural(n,one,many){return n+' '+(n===1?one:many)}
if(!/^[A-HJKMNP-Z2-9]{10}$/.test(code)){fail('Este convite não vale mais.');return}
var play=PLAY+'&referrer='+encodeURIComponent('utm_source=convite&utm_medium=lista&convite='+code);
$('play').href=play;
if(android){var open=$('open');open.href='intent://l/?c='+code+'#Intent;scheme=wendly;package=com.floaterlabs.wendly;S.browser_fallback_url='+encodeURIComponent(play)+';end';open.hidden=false}
fetch(SUPABASE_URL+'/rest/v1/rpc/shared_invite',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({invite:code})})
.then(function(r){if(!r.ok)throw new Error(String(r.status));return r.json()})
.then(function(list){
if(!list||typeof list.name!=='string'){fail('Este convite não vale mais.');return}
document.title=list.name+' · Wendly';
$('title').textContent=list.name;
var open=typeof list.open==='number'?list.open:0;
var by=typeof list.by==='string'&&list.by.trim()?list.by.trim():'';
$('lead').textContent=(by?by+' te chamou para esta lista no Wendly. ':'Lista compartilhada no Wendly. ')+plural(open,'tarefa aberta.','tarefas abertas.');
var tasks=Array.isArray(list.tasks)?list.tasks.filter(function(t){return typeof t==='string'&&t.trim()}):[];
var ul=$('tasks');
tasks.forEach(function(t){var li=document.createElement('li');li.textContent=t;ul.appendChild(li)});
ul.hidden=tasks.length===0;
if(open>tasks.length){$('more').textContent='e mais '+plural(open-tasks.length,'tarefa','tarefas')+'.';$('more').hidden=false}
if(iphone){$('iphone').hidden=false;return}
$('actions').hidden=false;
$('note').hidden=false;
})
.catch(function(){fail('Não consegui abrir o convite agora. Tente de novo em instantes.')});
})();
</script>
</body>
</html>
